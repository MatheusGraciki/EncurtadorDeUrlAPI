name: Deploy to Cloud Run

on:
  push:
    branches: ["master"]

env:
  PROJECT_ID: useful-tempest-482917-f6
  REGION: us-central1
  SERVICE: url-shortener
  REPOSITORY: cloud-run-repo
  IMAGE: url-shortener

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_RUN_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

       
      - name: Build Docker image
        run: |
          docker build -t \
          ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest .

      - name: Push Docker image
        run: |
          docker push \
          ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest

      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 256Mi \
            --cpu 1 \
            --max-instances 1 \
            --concurrency 1
  notify-sucess :
    needs: deploy
    runs-on: ubuntu-latest
    if: needs.deploy.result == 'success'
    steps:
      - name: Notify Discord (Sucess)
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "content": "✅ **DEPLOY REALIZADO COM SUCESSO**\n\n🔹 Serviço: **${{ env.SERVICE }}**\n🔹 Projeto: **${{ env.PROJECT_ID }}**\n🔹 Branch: **${{ github.ref_name }}**\n🔹 Commit: `${{ github.sha }}`\n📝 Mensagem: _${{ github.event.head_commit.message }}_\n\n🔗 Logs:\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }' \
          ${{ secrets.DISCORD_WEBHOOK_SUCCESS }}

  notify-failure:
      runs-on: ubuntu-latest
      needs: deploy
      if: needs.deploy.result == 'failure'
      steps:
        - name: Notify Discord (Failure)
          run: |
            curl -H "Content-Type: application/json" \
            -d '{
              "content": "❌ **DEPLOY FALHOU**\n\n🔹 Serviço: **${{ env.SERVICE }}**\n🔹 Projeto: **${{ env.PROJECT_ID }}**\n🔹 Branch: **${{ github.ref_name }}**\n🔹 Commit: `${{ github.sha }}`\n\n🚨 Ver logs:\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' \
            ${{ secrets.DISCORD_WEBHOOK_FAILURE }}

