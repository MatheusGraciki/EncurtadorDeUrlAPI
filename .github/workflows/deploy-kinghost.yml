name: Validate, publish and deploy

on:
  push:
    branches: [master]

concurrency:
  group: kinghost-production
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, audit, test and build
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm test
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
      - run: npm run build

  security:
    name: Gitleaks and CodeQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3

  publish:
    name: Build and publish image
    needs: [quality, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=${{ github.sha }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Export immutable image name
        id: image
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy API to KingHost
    needs: publish
    if: ${{ vars.KINGHOST_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.KINGHOST_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.KINGHOST_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/kinghost"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/kinghost" "$HOME/.ssh/known_hosts"
      - name: Deploy immutable image
        env:
          DEPLOY_HOST: ${{ secrets.KINGHOST_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.KINGHOST_SSH_USER }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          ssh -i "$HOME/.ssh/kinghost" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/sbin/deploy-shortener-api '$IMAGE'"
      - name: Record deployed image
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: echo "Deployed $IMAGE" >> "$GITHUB_STEP_SUMMARY"
